<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Blog | Taewon Park</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #8C1515; --text: #2d2d2d; --muted: #666; --bg: #ffffff; --border: rgba(0,0,0,0.08); }
        body { font-family: 'Inter', sans-serif; line-height: 1.7; color: var(--text); background: var(--bg); margin: 0; }
        
        .navbar { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 20px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 900px; margin: 0 auto; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.3rem; text-decoration: none; color: var(--text); }
        .nav-link { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.95rem; margin-left: 25px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { color: var(--primary); }

        .container { max-width: 800px; margin: 0 auto; padding: 60px 30px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; margin-bottom: 40px; }

        .post-card { 
            padding: 35px; 
            background: #fff; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            margin-bottom: 40px; 
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .post-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); border-color: var(--primary); }
        
        .post-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--primary); font-weight: 700; margin-bottom: 12px; display: block;}
        .post-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0 0 12px; line-height: 1.3; }
        .post-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; display: flex; gap: 15px; }
        .post-excerpt { color: var(--muted); font-size: 1.05rem; }

        footer { text-align: center; color: var(--muted); margin-top: 100px; padding: 40px 0; border-top: 1px solid var(--border); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Taewon Park</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="cv.html" class="nav-link">CV</a>
                <a href="blog-science.html" class="nav-link active">Science</a>
                <a href="blog-personal.html" class="nav-link">Personal</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Science Blog</h1>
        
        <article class="post-card">
            <span class="post-tag">Research Update</span>
            <h2 class="post-title">Coming Soon: Deep Dive into Lithium Niobate</h2>
            <div class="post-meta"><span>Dec 2025</span> <span>&bull;</span> <span>5 min read</span></div>
            <p class="post-excerpt">I will be sharing insights into our latest fabrication techniques for thin-film lithium niobate photonic circuits...</p>
        </article>

    </div>
    <footer>&copy; 2025 Taewon Park</footer>
</body>
</html>
